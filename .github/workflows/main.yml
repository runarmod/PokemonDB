name: Node.js CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: 🔄 Checkout
              uses: actions/checkout@v6

            - name: 🛠️ Using Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"

            - name: ⚙️ Install dependencies
              run: npm ci

            - name: 🧹 Linting
              run: npm run lint

            - name: 💁 Formatting
              run: npm run prettier

            - name: ✅ Testing
              run: npm test

            - name: 🏗️ Building
              run: npm run build
